<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi reloj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF3; --surface:#F7F9FB; --ink:#17212C; --muted:#5B6B7C; --rule:#CBD5DF;
  --steps:#2846C8; --steps-soft:#C9D3F5; --deep:#4B2C8F; --light:#9C86D6; --awake:#D8962B;
  --ok:#1E8A5A; --err:#B23A3A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A23; --surface:#1A2430; --ink:#E4EAF1; --muted:#8C9BAB; --rule:#2C3A49;
    --steps:#7D95FF; --steps-soft:#2A3768; --deep:#8F6FE0; --light:#C4B3F2; --awake:#E9AE4C;
    --ok:#4CC08A; --err:#E07070; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A23; --surface:#1A2430; --ink:#E4EAF1; --muted:#8C9BAB; --rule:#2C3A49;
  --steps:#7D95FF; --steps-soft:#2A3768; --deep:#8F6FE0; --light:#C4B3F2; --awake:#E9AE4C;
  --ok:#4CC08A; --err:#E07070; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:1.15rem;font-weight:700;margin:0}
.status{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dot.on{background:var(--ok)} .dot.busy{background:var(--awake)}
.hero{margin:26px 0 6px}
.hero .date{color:var(--muted);font-size:.95rem}
.big{font-stretch:62%;font-weight:800;font-size:clamp(4.5rem,24vw,7.5rem);line-height:.9;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;margin:6px 0 4px}
.big small{font-size:.24em;font-stretch:100%;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:.3em}
.goal{height:6px;background:var(--steps-soft);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.goal span{display:block;height:100%;background:var(--steps);width:0;transition:width .5s ease}
.meta{font-size:.9rem;color:var(--muted)}
.strip{margin:22px 0 4px;background:var(--surface);border-radius:14px;padding:14px 12px 8px}
.strip svg,.week svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin:8px 2px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 12px;cursor:pointer;
  background:var(--surface);color:var(--ink)}
button.primary{grid-column:1/-1;background:var(--steps);color:#fff;font-size:1.05rem}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--steps);outline-offset:2px}
h2{font-size:1rem;font-weight:700;margin:30px 0 10px}
.week{background:var(--surface);border-radius:14px;padding:12px}
.sleep-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sleep-sum div{background:var(--surface);border-radius:12px;padding:10px 12px}
.sleep-sum b{display:block;font-size:1.3rem;font-stretch:80%;font-variant-numeric:tabular-nums}
.sleep-sum span{font-size:.8rem;color:var(--muted)}
.msg{font-size:.92rem;padding:12px 14px;border-radius:12px;background:var(--surface);margin:14px 0;display:none}
.msg.show{display:block} .msg.err{color:var(--err)}
details{margin-top:28px;background:var(--surface);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
pre{font-size:.75rem;line-height:1.5;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--muted);margin:10px 0 0}
.settings{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.settings input{font:inherit;width:6.5em;padding:8px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.settings button{padding:9px 12px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.goal span{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Mi reloj</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Sin conectar</span></div>
  </header>

  <section class="hero">
    <div class="date" id="dayLabel">Hoy</div>
    <div class="big" id="steps">0<small>pasos</small></div>
    <div class="goal"><span id="goalBar"></span></div>
    <div class="meta" id="goalText"></div>
  </section>

  <div class="strip">
    <svg id="dayChart" viewBox="0 0 288 120" role="img" aria-label="Pasos por hora y sueño del día"></svg>
    <div class="legend">
      <span><i style="background:var(--steps)"></i>Pasos por hora</span>
      <span><i style="background:var(--deep)"></i>Sueño profundo</span>
      <span><i style="background:var(--light)"></i>Sueño ligero</span>
      <span><i style="background:var(--awake)"></i>Despierto</span>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="actions">
    <button class="primary" id="btnSync">Conectar y sincronizar</button>
    <button id="btnFind" disabled>Hacer vibrar</button>
    <button id="btnCsv">Exportar CSV</button>
  </div>

  <h2>Últimos 14 días</h2>
  <div class="week"><svg id="weekChart" viewBox="0 0 288 110" role="img" aria-label="Pasos de los últimos 14 días. Toca un día para verlo."></svg></div>

  <h2>Sueño de la noche</h2>
  <div class="sleep-sum">
    <div><b id="sTotal">—</b><span>Dormido</span></div>
    <div><b id="sDeep">—</b><span>Profundo</span></div>
    <div><b id="sAwake">—</b><span>Despierto</span></div>
  </div>
  <div class="meta" id="sRange" style="margin-top:8px"></div>

  <details>
    <summary>Ajustes y registro técnico</summary>
    <div class="settings">
      <label for="goalInput">Meta diaria</label>
      <input id="goalInput" type="number" min="500" step="500" inputmode="numeric">
      <button id="btnGoal">Guardar meta</button>
      <button id="btnClear">Borrar datos guardados</button>
    </div>
    <div class="meta" id="devInfo" style="margin-top:10px"></div>
    <pre id="log"></pre>
  </details>
</main>

<script>
/* ===== Protocolo Lefun (ZK41 / eWatch) ===== */
const SVC = 0x18d0, CH_NOTIFY = 0x2d00, CH_WRITE = 0x2d01;
const CMD = { FIRMWARE:0x00, BATTERY:0x03, TIME:0x04, FIND:0x09, STEPS:0x12, ACTIVITY:0x13, SLEEP:0x15 };

function crc8(bytes){ // CRC-8/MAXIM, verificado con tramas reales del reloj
  let c = 0;
  for (const b of bytes){ c ^= b; for (let i=0;i<8;i++) c = (c & 1) ? (c >>> 1) ^ 0x8c : c >>> 1; }
  return c;
}
function buildFrame(cmd, params=[]){
  const body = [0xab, 4 + params.length, cmd, ...params];
  return new Uint8Array([...body, crc8(body)]);
}
const hex = a => Array.from(a, b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
const u16 = (p,i) => (p[i] << 8) | p[i+1];
const u32 = (p,i) => ((p[i] << 24) >>> 0) + (p[i+1] << 16) + (p[i+2] << 8) + p[i+3];
const pad = n => String(n).padStart(2,'0');

/* ===== Almacenamiento ===== */
const KEY = 'ewatch-zk41-v1';
let mem = null;
function load(){
  if (mem) return mem;
  try { mem = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ mem = null; }
  if (!mem) mem = { blocks:{}, days:{}, sleep:{}, goal:6000, lastSync:null, model:'' };
  return mem;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} }

/* ===== BLE ===== */
let device = null, chWrite = null, chNotify = null, rxBuf = [], waiters = [], busy = false;
const $ = id => document.getElementById(id);

function log(dir, bytes){
  const t = new Date().toLocaleTimeString('es-CO',{hour12:false});
  const el = $('log');
  el.textContent = `${t} ${dir} ${hex(bytes)}\n` + el.textContent.split('\n').slice(0,200).join('\n');
}
function setStatus(text, state){
  $('status').textContent = text;
  $('dot').className = 'dot' + (state ? ' ' + state : '');
}
function showMsg(text, isErr){
  const m = $('msg'); m.textContent = text; m.className = 'msg show' + (isErr ? ' err' : '');
}

function onNotify(ev){
  const v = new Uint8Array(ev.target.value.buffer);
  rxBuf.push(...v);
  while (rxBuf.length >= 2){
    if (rxBuf[0] !== 0x5a){ rxBuf.shift(); continue; }
    const len = rxBuf[1];
    if (len < 4 || len > 20){ rxBuf.shift(); continue; }
    if (rxBuf.length < len) break;
    const fr = rxBuf.splice(0, len);
    log('RX', fr);
    if (crc8(fr.slice(0,-1)) !== fr[len-1]) continue;
    const cmd = fr[2], p = fr.slice(3, -1);
    const w = waiters.find(x => x.cmd === cmd);
    if (!w) continue;
    w.frames.push(p);
    if (w.isDone(p)) finishWaiter(w);
  }
}
function finishWaiter(w){
  clearTimeout(w.timer);
  waiters = waiters.filter(x => x !== w);
  w.resolve(w.frames);
}
async function request(cmd, params=[], isDone=()=>true, timeout=2500){
  const frame = buildFrame(cmd, params);
  const p = new Promise(resolve => {
    const w = { cmd, isDone, frames:[], resolve };
    w.timer = setTimeout(() => finishWaiter(w), timeout);
    waiters.push(w);
  });
  log('TX', frame);
  if (chWrite.writeValueWithoutResponse && chWrite.properties.writeWithoutResponse)
    await chWrite.writeValueWithoutResponse(frame);
  else await chWrite.writeValue(frame);
  return p;
}

async function connect(){
  if (!navigator.bluetooth){
    throw new Error('Este navegador no tiene Web Bluetooth. Abre la página en Chrome para Android, servida por HTTPS.');
  }
  if (!device){
    device = await navigator.bluetooth.requestDevice({
      filters:[{ namePrefix:'eWatch' }, { services:[SVC] }],
      optionalServices:[SVC]
    });
    device.addEventListener('gattserverdisconnected', () => {
      chWrite = chNotify = null; setStatus('Desconectado'); $('btnFind').disabled = true;
    });
  }
  if (!device.gatt.connected || !chWrite){
    setStatus('Conectando…','busy');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    chNotify = await svc.getCharacteristic(CH_NOTIFY);
    chWrite = await svc.getCharacteristic(CH_WRITE);
    await chNotify.startNotifications();
    chNotify.addEventListener('characteristicvaluechanged', onNotify);
  }
  setStatus('Conectado','on');
  $('btnFind').disabled = false;
}

/* ===== Sincronización ===== */
async function sync(){
  if (busy) return;
  busy = true; $('btnSync').disabled = true;
  const d = load();
  try {
    await connect();
    setStatus('Sincronizando…','busy');

    const now = new Date();
    await request(CMD.TIME, [1, now.getFullYear()-2000, now.getMonth()+1, now.getDate(),
                             now.getHours(), now.getMinutes(), now.getSeconds()]);

    const bat = await request(CMD.BATTERY);
    if (bat[0]) d.battery = bat[0][0];

    const fw = await request(CMD.FIRMWARE);
    if (fw[0] && fw[0].length >= 8) d.model = String.fromCharCode(...fw[0].slice(4,8)).replace(/[^\x20-\x7e]/g,'');

    // Total del día: daysAgo, año, mes, día, pasos(4), distancia(4), calorías(4)
    const st = await request(CMD.STEPS, [0]);
    if (st[0] && st[0].length >= 8){
      const p = st[0], k = `20${pad(p[1])}-${pad(p[2])}-${pad(p[3])}`;
      d.days[k] = Math.max(d.days[k] || 0, u32(p,4));
    }

    // Bloques de 15 min: daysAgo, total, actual, año, mes, día, hora, min, pasos(2), dist(2), cal(2)
    const act = await request(CMD.ACTIVITY, [0], p => p[1] === 0 || p[2] >= p[1], 4000);
    let nBlocks = 0;
    for (const p of act){
      if (p.length < 10 || p[1] === 0) continue;
      d.blocks[`20${pad(p[3])}-${pad(p[4])}-${pad(p[5])}T${pad(p[6])}:${pad(p[7])}`] = u16(p,8);
      nBlocks++;
    }

    // Sueño: daysAgo, total(2), actual(2), año, mes, día, hora, min, tipo (1 despierto, 2 ligero, 3 profundo)
    const sl = await request(CMD.SLEEP, [0], p => u16(p,1) === 0 || u16(p,3) >= u16(p,1), 4000);
    for (const p of sl){
      if (p.length < 11 || u16(p,1) === 0) continue;
      d.sleep[`20${pad(p[5])}-${pad(p[6])}-${pad(p[7])}T${pad(p[8])}:${pad(p[9])}`] = p[10];
    }
    fixFutureSleep(d);
    // Nota: el comando 0x11 (pulso/presión/oxígeno) no se envía; este reloj no lo responde.

    d.lastSync = new Date().toISOString();
    save();
    selectedDay = todayKey();
    render();
    setStatus('Conectado','on');
    showMsg(`Sincronizado: ${nBlocks} bloque${nBlocks===1?'':'s'} de 15 minutos y batería al ${d.battery ?? '—'} %.`);
  } catch(e){
    if (e.name === 'NotFoundError') showMsg('No elegiste ningún reloj. Toca “Conectar y sincronizar” y selecciona eWatch.', true);
    else showMsg((e.message || String(e)) + ' Si el reloj está conectado a otra app (Gadgetbridge o la oficial), desconéctalo primero.', true);
    setStatus(device && device.gatt.connected ? 'Conectado' : 'Sin conectar', device && device.gatt.connected ? 'on' : '');
  } finally {
    busy = false; $('btnSync').disabled = false;
  }
}

async function findWatch(){
  try { await connect(); const r = await request(CMD.FIND);
    showMsg(r[0] && r[0][0] === 1 ? 'El reloj debería estar vibrando.' : 'El reloj no confirmó la orden de vibrar.');
  } catch(e){ showMsg(e.message || String(e), true); }
}

/* ===== Vista ===== */
let selectedDay = null;
const todayKey = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; };
function dayTotal(d, k){
  const fromBlocks = Object.entries(d.blocks).filter(([t]) => t.startsWith(k)).reduce((s,[,v]) => s+v, 0);
  return Math.max(d.days[k] || 0, fromBlocks);
}
function sleepSegments(d, k){
  // Cada registro marca un estado que dura hasta el siguiente registro (máx. 60 min); el último, 15 min.
  const recs = Object.entries(d.sleep).map(([t,v]) => [new Date(t), v]).sort((a,b) => a[0]-b[0]);
  const start = new Date(k+'T00:00'), end = new Date(start.getTime() + 864e5), segs = [];
  recs.forEach(([t,v], i) => {
    const next = recs[i+1] ? recs[i+1][0] : new Date(t.getTime() + 15*6e4);
    const e = new Date(Math.min(next, t.getTime() + 60*6e4));
    const s0 = Math.max(t, start), e0 = Math.min(e, end);
    if (e0 > s0) segs.push({ s:(s0-start)/6e4, e:(e0-start)/6e4, type:v });
  });
  return segs;
}
function fixFutureSleep(d){
  // El reloj etiqueta el inicio de la noche anterior (p. ej. 22:00) con la fecha nueva.
  // Un registro con hora futura pertenece en realidad al día anterior.
  const lim = Date.now() + 5*6e4; let changed = false;
  for (const [k,v] of Object.entries(d.sleep)){
    const t = new Date(k);
    if (t.getTime() > lim){
      t.setDate(t.getDate()-1); delete d.sleep[k];
      d.sleep[`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T${pad(t.getHours())}:${pad(t.getMinutes())}`] = v;
      changed = true;
    }
  }
  if (changed) save();
}
function nightSummary(d, k){
  // Noche que termina el día k: de las 18:00 del día anterior a las 18:00 del día k.
  const end = new Date(k+'T18:00'), start = new Date(end.getTime() - 864e5);
  const recs = Object.entries(d.sleep).map(([t,v]) => [new Date(t), v])
    .filter(([t]) => t >= start && t < end).sort((a,b) => a[0]-b[0]);
  // Segmentos: cada registro dura hasta el siguiente. Un tramo despierto de 60 min o más separa sesiones.
  const segs = recs.map((r,i) => ({ t:r[0], type:r[1],
    end: recs[i+1] ? recs[i+1][0] : new Date(r[0].getTime() + 15*6e4) }));
  const sessions = []; let cur = [];
  for (const sg of segs){
    if (sg.type === 1 && (sg.end - sg.t) >= 60*6e4){ if (cur.length) sessions.push(cur); cur = []; }
    else cur.push(sg);
  }
  if (cur.length) sessions.push(cur);
  let best = null, bestMin = 0;
  for (let ss of sessions){
    while (ss.length && ss[0].type === 1) ss = ss.slice(1);
    while (ss.length && ss[ss.length-1].type === 1) ss = ss.slice(0,-1);
    if (!ss.length) continue;
    const sum = {1:0,2:0,3:0};
    ss.forEach(sg => sum[sg.type] += (sg.end - sg.t) / 6e4);
    if (sum[2] + sum[3] > bestMin){ bestMin = sum[2] + sum[3]; best = { sum, from:ss[0].t, to:ss[ss.length-1].end }; }
  }
  return best;
}
const fmtMin = m => m < 60 ? `${Math.round(m)} min` : `${Math.floor(m/60)} h ${pad(Math.round(m%60))}`;
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
}

function render(){
  const d = load(), k = selectedDay || todayKey(), isToday = k === todayKey();
  fixFutureSleep(d);
  const total = dayTotal(d, k);
  const dt = new Date(k+'T12:00');
  $('dayLabel').textContent = isToday ? 'Hoy' : dt.toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'long'});
  $('steps').innerHTML = `${total.toLocaleString('es-CO')}<small>pasos</small>`;
  const pct = Math.min(100, total / d.goal * 100);
  $('goalBar').style.width = pct + '%';
  $('goalText').textContent = total >= d.goal
    ? `Meta de ${d.goal.toLocaleString('es-CO')} cumplida.`
    : `Faltan ${(d.goal-total).toLocaleString('es-CO')} para la meta de ${d.goal.toLocaleString('es-CO')}.` +
      (d.lastSync ? ` Última sincronización: ${new Date(d.lastSync).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}.` : '');
  $('goalInput').value = d.goal;
  $('devInfo').textContent = d.model ? `Modelo ${d.model}${d.battery != null ? `, batería ${d.battery} %` : ''}.` : 'Aún no se ha leído el reloj.';

  // Día: barras por hora + franja de sueño
  const svg = $('dayChart'); svg.innerHTML = '';
  const hours = Array(24).fill(0);
  for (const [t,v] of Object.entries(d.blocks)) if (t.startsWith(k)) hours[+t.slice(11,13)] += v;
  const maxH = Math.max(100, ...hours);
  hours.forEach((v,h) => {
    const bh = v ? Math.max(2, v / maxH * 78) : 0;
    el('rect', { x:h*12+2, y:84-bh, width:8, height:bh, rx:1.5, fill:'var(--steps)' }, svg);
    if (v){ const r = svg.lastChild; const tt = document.createElementNS(NS,'title'); tt.textContent = `${h}:00 — ${v} pasos`; r.appendChild(tt); }
  });
  el('line', { x1:0, x2:288, y1:84.5, y2:84.5, stroke:'var(--rule)' }, svg);
  el('rect', { x:0, y:90, width:288, height:8, rx:2, fill:'var(--bg)' }, svg);
  const colors = { 1:'var(--awake)', 2:'var(--light)', 3:'var(--deep)' };
  const segs = sleepSegments(d, k);
  segs.forEach(s => el('rect', { x:s.s/5, y:90, width:Math.max(.8,(s.e-s.s)/5), height:8, fill:colors[s.type] || 'var(--muted)' }, svg));
  [0,6,12,18].forEach(h => { const t = el('text', { x:h*12+1, y:114, 'font-size':9, fill:'var(--muted)' }, svg); t.textContent = `${h}h`; });
  if (!hours.some(Boolean) && !segs.length){
    const t = el('text', { x:144, y:48, 'text-anchor':'middle', 'font-size':10, fill:'var(--muted)' }, svg);
    t.textContent = isToday ? 'Sincroniza para ver tu día' : 'Sin datos guardados para este día';
  }

  // Sueño
  const n = nightSummary(d, k);
  const hm = t => t.toLocaleTimeString('es-CO',{hour:'numeric', minute:'2-digit'});
  $('sTotal').textContent = n ? fmtMin(n.sum[2] + n.sum[3]) : '—';
  $('sDeep').textContent = n ? fmtMin(n.sum[3]) : '—';
  $('sAwake').textContent = n ? fmtMin(n.sum[1]) : '—';
  $('sRange').textContent = n
    ? `De ${hm(n.from)} a ${hm(n.to)}, con ${fmtMin(n.sum[2])} de sueño ligero.`
    : 'Sin sueño registrado para la noche anterior a este día.';

  // 14 días
  const w = $('weekChart'); w.innerHTML = '';
  const days = []; for (let i=13;i>=0;i--){ const x = new Date(); x.setDate(x.getDate()-i);
    days.push(`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`); }
  const vals = days.map(x => dayTotal(d, x)), maxW = Math.max(d.goal, ...vals);
  const gy = 86 - d.goal / maxW * 80;
  el('line', { x1:0, x2:288, y1:gy, y2:gy, stroke:'var(--muted)', 'stroke-dasharray':'3 3', 'stroke-width':.7 }, w);
  days.forEach((x,i) => {
    const v = vals[i], bh = v ? Math.max(2, v / maxW * 80) : 0, sel = x === k;
    const g = el('g', { style:'cursor:pointer', tabindex:0, role:'button', 'aria-label':`${x}: ${v} pasos` }, w);
    el('rect', { x:i*20.57, y:0, width:20.57, height:110, fill:'transparent' }, g);
    el('rect', { x:i*20.57+4, y:86-bh, width:12.5, height:bh, rx:2,
      fill: sel ? 'var(--steps)' : 'var(--steps-soft)' }, g);
    const t = el('text', { x:i*20.57+10.3, y:102, 'text-anchor':'middle', 'font-size':8.5,
      fill: sel ? 'var(--ink)' : 'var(--muted)', 'font-weight': sel ? 700 : 400 }, g);
    t.textContent = new Date(x+'T12:00').getDate();
    const pick = () => { selectedDay = x; render(); };
    g.addEventListener('click', pick);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
}

function exportCsv(){
  const d = load(), rows = [['tipo','fecha_hora','valor']];
  Object.entries(d.blocks).sort().forEach(([t,v]) => rows.push(['pasos_15min', t, v]));
  Object.entries(d.days).sort().forEach(([t,v]) => rows.push(['pasos_dia', t, v]));
  const names = {1:'despierto',2:'ligero',3:'profundo'};
  Object.entries(d.sleep).sort().forEach(([t,v]) => rows.push(['sueno', t, names[v] || v]));
  const blob = new Blob([rows.map(r => r.join(',')).join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `reloj_${todayKey()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('btnSync').addEventListener('click', sync);
$('btnFind').addEventListener('click', findWatch);
$('btnCsv').addEventListener('click', exportCsv);
$('btnGoal').addEventListener('click', () => {
  const v = parseInt($('goalInput').value, 10);
  if (v >= 500){ load().goal = v; save(); render(); showMsg(`Meta guardada: ${v.toLocaleString('es-CO')} pasos.`); }
});
$('btnClear').addEventListener('click', () => {
  if (confirm('¿Borrar todo el historial guardado en este navegador?')){
    const g = load().goal; mem = { blocks:{}, days:{}, sleep:{}, goal:g, lastSync:null, model:'' }; save(); render();
    showMsg('Historial borrado.');
  }
});
if (!navigator.bluetooth) showMsg('Este navegador no tiene Web Bluetooth. Abre la página en Chrome para Android, servida por HTTPS.', true);
render();
</script>
